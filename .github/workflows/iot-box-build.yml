name: Build POS Print Agent

on:
  push:
    paths:
      - "**"
  pull_request:
    paths:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore PosPrintAgent.sln
      - run: dotnet build PosPrintAgent.sln --configuration Release --no-restore

  publish:
    name: Publish ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish src/PosPrintAgent/PosPrintAgent.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true --output publish/${{ matrix.rid }}
      - shell: pwsh
        if: matrix.rid == 'win-x64'
        run: |
          Copy-Item install-windows.ps1 publish/${{ matrix.rid }}/install-windows.ps1
          Copy-Item uninstall-windows.ps1 publish/${{ matrix.rid }}/uninstall-windows.ps1
      - shell: pwsh
        run: |
          Copy-Item README.md publish/${{ matrix.rid }}/README.md
          Compress-Archive -Path publish/${{ matrix.rid }}/* -DestinationPath pos-print-agent-${{ matrix.rid }}.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: pos-print-agent-${{ matrix.rid }}
          path: pos-print-agent-${{ matrix.rid }}.zip
          if-no-files-found: error
