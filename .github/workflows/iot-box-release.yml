name: Release POS Print Agent

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a publicar, por ejemplo v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish src/PosPrintAgent/PosPrintAgent.csproj --configuration Release --runtime win-x64 --self-contained true --output publish/win-x64
      - shell: pwsh
        run: |
          Copy-Item install-windows.ps1 publish/win-x64/install-windows.ps1
          Copy-Item uninstall-windows.ps1 publish/win-x64/uninstall-windows.ps1
          Copy-Item README.md publish/win-x64/README.md
      - uses: actions/upload-artifact@v4
        with:
          name: pos-print-agent-release
          path: publish/win-x64

  release:
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pos-print-agent-release
          path: release-payload
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: release-payload/**
