name: Release POS Print Agent

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a publicar, por ejemplo v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: Publish ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish src/PosPrintAgent/PosPrintAgent.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true --output publish/${{ matrix.rid }}
      - shell: pwsh
        if: matrix.rid == 'win-x64'
        run: |
          Copy-Item install-windows.ps1 publish/${{ matrix.rid }}/install-windows.ps1
          Copy-Item uninstall-windows.ps1 publish/${{ matrix.rid }}/uninstall-windows.ps1
      - shell: pwsh
        run: |
          Copy-Item README.md publish/${{ matrix.rid }}/README.md
          Compress-Archive -Path publish/${{ matrix.rid }}/* -DestinationPath pos-print-agent-${{ matrix.rid }}.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: pos-print-agent-${{ matrix.rid }}
          path: pos-print-agent-${{ matrix.rid }}.zip
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pos-print-agent-*
          path: release-payload
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: release-payload/*.zip
