<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>POS Print Agent</title><style>
:root{font:15px system-ui;color:#202124;background:#f5f5f3}body{max-width:800px;margin:40px auto;padding:0 18px}main{background:#fff;border:1px solid #ddd;border-radius:10px;padding:24px}h1{font-size:22px;margin-top:0}h2{font-size:17px;margin-top:28px}form{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:grid;gap:5px}input,select{padding:9px;border:1px solid #bbb;border-radius:6px;background:#fff}button{padding:10px 14px;border:0;border-radius:6px;background:#1f2937;color:#fff;cursor:pointer}.wide{grid-column:1/-1}.status{color:#666;margin-bottom:20px}li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #eee}small{color:#666}
</style></head><body><main><h1>POS Print Agent</h1><div id="status" class="status">Cargando...</div><button id="discover" class="wide">Buscar impresoras conectadas</button><form id="form"><label>Nombre<input name="name" required></label><label>Host/IP<input name="host" value="127.0.0.1" required></label><label>Puerto<input name="port" type="number" value="9100" required></label><label>Ancho<select name="width"><option value="58">58 mm</option><option value="80" selected>80 mm</option></select></label><button class="wide">Agregar impresora configurada</button></form><h2>Impresoras configuradas</h2><ul id="printers"></ul><h2>Impresoras detectadas en el sistema</h2><ul id="devices"><li><small>Pulsa “Buscar impresoras conectadas”.</small></li></ul></main><script>
const $=s=>document.querySelector(s);let token='';async function load(){const s=await fetch('/api/status').then(r=>r.json());token=s.token;$('#status').textContent=`Escuchando localmente. Token: ${token}`;const p=await fetch('/api/printers').then(r=>r.json());$('#printers').innerHTML=p.map(x=>`<li><span>${x.name} · ${x.protocol} · ${x.paperWidthMm} mm</span><button data-name="${x.name}">Eliminar</button></li>`).join('')||'<li><small>No hay impresoras configuradas.</small></li>';document.querySelectorAll('[data-name]').forEach(b=>b.onclick=async()=>{await fetch('/api/printers/'+encodeURIComponent(b.dataset.name),{method:'DELETE'});load()})}async function discover(){const d=await fetch('/api/devices',{headers:{'X-Print-Agent-Token':token}}).then(r=>r.json());$('#devices').innerHTML=d.map(x=>`<li><span>${x.name} · ${x.connection}${x.isUsb?' · USB':''}</span><button data-device="${x.name}" data-usb="${x.isUsb}">Usar</button></li>`).join('')||'<li><small>No se detectaron impresoras.</small></li>';document.querySelectorAll('[data-device]').forEach(b=>b.onclick=async()=>{await fetch('/api/printers/from-device',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:b.dataset.device,isUsb:b.dataset.usb==='true',paperWidthMm:+$('#form [name=width]').value})});load()})}$('#discover').onclick=discover;$('#form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);await fetch('/api/printers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:f.get('name'),host:f.get('host'),port:+f.get('port'),paperWidthMm:+f.get('width'),protocol:'tcp'})});e.target.reset();load()};load();
</script></body></html>
