<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>POS Print Agent</title><style>
:root{font:15px system-ui;color:#202124;background:#f5f5f3}body{max-width:760px;margin:40px auto;padding:0 18px}main{background:white;border:1px solid #ddd;border-radius:10px;padding:24px}h1{font-size:22px;margin-top:0}form{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:grid;gap:5px}input{padding:9px;border:1px solid #bbb;border-radius:6px}button{padding:10px 14px;border:0;border-radius:6px;background:#1f2937;color:white;cursor:pointer}.wide{grid-column:1/-1}.status{color:#666;margin-bottom:20px}li{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}
</style></head><body><main><h1>POS Print Agent</h1><div id="status" class="status">Cargando...</div><form id="form"><label>Nombre<input name="name" required></label><label>Host/IP<input name="host" value="127.0.0.1" required></label><label>Puerto<input name="port" type="number" value="9100" required></label><label>Ancho<input name="width" type="number" value="576" required></label><button class="wide">Agregar impresora</button></form><h2>Impresoras</h2><ul id="printers"></ul></main><script>
const $=s=>document.querySelector(s);async function load(){const s=await fetch('/api/status').then(r=>r.json());$('#status').textContent=`Escuchando localmente. Token: ${s.token}`;const p=await fetch('/api/printers').then(r=>r.json());$('#printers').innerHTML=p.map(x=>`<li><span>${x.name} · ${x.host}:${x.port} · ${x.paperWidth}px</span><button data-name="${x.name}">Eliminar</button></li>`).join('');document.querySelectorAll('[data-name]').forEach(b=>b.onclick=async()=>{await fetch('/api/printers/'+encodeURIComponent(b.dataset.name),{method:'DELETE'});load()})}$('#form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);await fetch('/api/printers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:f.get('name'),host:f.get('host'),port:+f.get('port'),paperWidth:+f.get('width')})});e.target.reset();load()};load();
</script></body></html>
